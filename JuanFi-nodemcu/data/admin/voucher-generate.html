<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,Helvetica,sans-serif;
  padding: 10px;
  background-color: #eef2f5;
  color: #101418;
  margin: 0;
}
button {
  border: none;
  padding: 10px 16px;
  border-radius: 9px;
  margin: 4px 8px 12px 0;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  min-height: 44px;
  background-color: #067647;
}
button:last-of-type { background-color: #d92d20; }
#theBody {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  -webkit-user-select: none;
  user-select: none;
}
.voucher-box {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px dashed #067647;
  background-color: #fff;
  box-shadow: 0 1px 2px rgba(16,24,40,.08);
  flex: 1 1 220px;
  max-width: 320px;
  min-width: 0;
}
.panel p {
  font-size: 12px;
  font-weight: bold;
  color: #101418;
}
.title {
  display: block;
  text-align: center;
  padding: 0 0 6px 0;
  margin-bottom: 8px;
  color: #101418;
  font-weight: 800;
  border-bottom: 2px solid #101418;
}
/* Create three equal columns that floats next to each other */
.column {
  float: none;
}
.info {
  font-size: 14px;
  color: #5b6570;
  display: block;
  margin: 2px 0;
}
.voucher-code {
  display: inline-block;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: .04em;
  color: #101418;
  font-variant-numeric: tabular-nums;
  -webkit-user-select: all;
  user-select: all;
}
</style>
<script>

	function escHtml(s){
		return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
	}

	function printMe(){
		window.print();
	}
	
	function clearAll(){
		document.getElementById("theBody").innerHTML = "";
		localStorage.removeItem("voucherData");
	}
	
	var ticketTemplate = " <div class='voucher-box column'>";
		ticketTemplate += "<span class='title'>REPLACE_VENDO_NAME</span>";
		ticketTemplate += "<br/>";
		ticketTemplate += "<label class='info'>Code: <span class='voucher-code'>REPLACE_VOUCHER_CODE</span></label>";
		ticketTemplate += "<label class='info'><b>Duration: REPLACE_DURATION</b></label><br>";
		ticketTemplate += "<label class='info'><b>Amount: REPLACE_AMOUNT</b></label><br>";
		ticketTemplate += "</div>";
		
	var NUMBER_OF_COLS = 4;
		
	function onLoad(){
	
		var data = localStorage.getItem("voucherData");
		var localData = data.split("~");
		var html = "";
		for(var k=0;k<localData.length;k++){
			var voucherData = localData[k].split("|");
			var voucherRows = voucherData[3].split("#");
			for(var i=0;i<voucherRows.length;i++){
			var rowScript = ticketTemplate;
			rowScript = rowScript.replaceAll("REPLACE_VENDO_NAME",escHtml(voucherData[0]));
			rowScript = rowScript.replaceAll("REPLACE_VOUCHER_CODE",escHtml(voucherRows[i]));
			rowScript = rowScript.replaceAll("REPLACE_DURATION",escHtml(secondsToDhms(voucherData[2])));
			rowScript = rowScript.replaceAll("REPLACE_AMOUNT",escHtml(voucherData[1]));
				html += rowScript;
			}
		}
		document.getElementById("theBody").innerHTML+= html;
	}
	
	function secondsToDhms(seconds) {
		seconds = Number(seconds);
		var d = Math.floor(seconds / (3600*24));
		var h = Math.floor(seconds % (3600*24) / 3600);
		var m = Math.floor(seconds % 3600 / 60);
		var s = Math.floor(seconds % 60);

		var dDisplay = d > 0 ? d + (d == 1 ? " Day " : " Days ") : "";
		var hDisplay = h > 0 ? h + (h == 1 ? " Hour " : " Hours ") : "";
		var mDisplay = m > 0 ? m + (m == 1 ? " Min " : " Mins ") : "";
		return dDisplay + hDisplay + mDisplay;
	}

</script>

</head>
<body  onLoad="onLoad()">
	<button onclick="printMe(this)">Print</button>
	<button onclick="clearAll(this)">Clear</button>
	
	<div id="theBody"> </div>

</body>
</html>
