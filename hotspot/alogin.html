<!DOCTYPE html>
<html lang="en">

<head>
   <title>Congratulations</title>
   <link rel="stylesheet" href="assets/css/bootstrap.min.css?v=26">
    <link rel="stylesheet" href="assets/css/core.css?v=62">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101418">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta http-equiv="refresh" content="1; url=$(link-status)">
   <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <span id="aloginErr" style="display:none">$(error)</span>
    <span id="aloginUser" style="display:none">$(username)</span>
    <script>
          // textContent reads: $(error)/$(username) never sit in a JS
          // string, so quotes in vouchers can't break out.
          var error = "";
          try { error = document.getElementById("aloginErr").textContent || ""; } catch (e) {}
          var aun = "";
          try { aun = document.getElementById("aloginUser").textContent || ""; } catch (e) {}
          if (error == "customer " + aun + " has reached uptime limit") {
                window.location.href = "./login.html";
          }
    </script> 
   
         $(if chap-id)
         <form name="sendin" action="$(link-login-only)" method="post">
            <input type="hidden" name="username" />
            <input type="hidden" name="password" />
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
         </form>

   $(endif)
</head>
<body>
   <div class="spinner" role="status" style="display:block;text-align:center;padding-top:30vh">
      <div class="spinner-ring" style="margin:0 auto 12px"></div>
      <div><b id="aloginBrand" style="color:#fff">Loading your data…</b></div>
      <p style="color:#c9cfd7;margin:8px 0 0">Connecting…</p>
   </div>
   <noscript><p>Portal needs JavaScript. Enable it and reload.</p></noscript>
   <script src="assets/js/config.js?v=62"></script>
   <script>
      try {
         var ab = String(typeof brandHeaderHtml !== "undefined" ? brandHeaderHtml : "").replace(/<[^>]*>/g, "") || "Loading your data…";
         document.getElementById("aloginBrand").textContent = ab;
      } catch (e) {}
   </script>
</body>
</html>
