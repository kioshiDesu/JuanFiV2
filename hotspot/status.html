<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="stylesheet" href="assets/css/bootstrap.min.css?v=26">
		<link rel="stylesheet" href="assets/css/core.css?v=2">
	<link rel="stylesheet" href="assets/css/JuanFiV2.css?v=2">
	<title>JuanFiV2 - Status</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<script src="assets/js/config.js?v=2"></script>
	<script>
		// Client facts for the single-file portal (portal.html renders the UI).
		window.PAGE = "status";
		window.loginError = "";
		window.mac = "$(mac)";
		window.uIp = "$(ip)";
		window.hotspotAddress = "$(server-address)";
		window.interfaceName = "$(interface-name)";
		window.sessiontime = "$(session-time-left-secs)";
		window.currentVoucher = "";
		window.loginAction = "$(link-login-only)";
		window.logoutAction = "$(link-logout)";
		window.name = "hotspot_status";
	</script>
	<script src="assets/js/boot.js?v=2"></script>
</head>

<!-- $(username) is user-controlled: never inline in JS/attributes (quote
     breakout). textContent read keeps quotes inert; attribute set via JS. -->
<body id="loginBody" data-session-time="$(session-time-left-secs)">
<span id="curV" style="display:none">$(username)</span>
<script>
	try {
		window.currentVoucher = document.getElementById("curV").textContent || "";
		document.getElementById("loginBody").setAttribute("data-current-voucher", window.currentVoucher);
	} catch (e) {}
</script>

<div id="bootLoader">
	<div class="spinner-ring"></div>
	<div><b id="bootBrand">Loading your data…</b></div>
	<div id="bootText"></div>
</div>

<div id="app" style="display: none"></div>

<script>
	$(if refresh-timeout)
		// Router session refresh; waits for the injected app (jQuery) first.
		window.refreshSecs = $(refresh-timeout-secs);
		var refreshWait = setInterval(function () {
			if (typeof window.jQuery === 'undefined') { return; }
			clearInterval(refreshWait);
			setInterval(function () {
				if (typeof insertingCoin === 'undefined' || !insertingCoin) {
					location.reload();
				}
			}, window.refreshSecs * 1000);
		}, 500);
	$(endif)
</script>

</body>

</html>
