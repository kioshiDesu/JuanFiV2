<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="stylesheet" href="assets/css/base.css?v=172">
		<link rel="stylesheet" href="assets/css/core.css?v=189">
	<link rel="stylesheet" href="assets/css/JuanFiV2.css?v=178">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1">
		<title>JuanFiV2 - Status</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#101418">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<script>
		// Client facts for the single-file portal (portal.html renders the UI).
		window.PAGE = "status";
		window.loginError = "";
		window.mac = "$(mac)";
		window.uIp = "$(ip)";
		window.hotspotAddress = "$(server-address)";
		window.interfaceName = "$(interface-name)";
		window.sessiontime = "$(session-time-left-secs)";
		window.currentVoucher = "";
		window.loginAction = "$(link-login-only)";
		window.logoutAction = "$(link-logout)";
		window.name = "hotspot_status";
	</script>
	$(if chap-id)
	<script>
		window.chapId = "$(chap-id)";
		window.chapChallenge = "$(chap-challenge)";
	</script>
	$(endif)
</head>

<!-- $(username) and $(link-orig) are user-controlled and RouterOS escapes
     neither. -esc percent-encodes < > " & so no tag or attribute can break
     out. Username is decoded below (it is displayed and prefilled);
     link-orig stays encoded because it is only ever the dst form field. -->
<body id="loginBody" data-session-time="$(session-time-left-secs)">
<span id="curV" style="display:none">$(username-esc)</span>
<span id="loginDst" style="display:none">$(link-orig-esc)</span>
<span id="bytesIn" style="display:none">$(bytes-in-nice)</span>
<span id="bytesOut" style="display:none">$(bytes-out-nice)</span>
<script>
	try {
		var cv = document.getElementById("curV").textContent || "";
		try { cv = decodeURIComponent(cv); } catch (x) { }
		window.currentVoucher = cv;
		document.getElementById("loginBody").setAttribute("data-current-voucher", cv);
		window.loginDst = document.getElementById("loginDst").textContent || "";
		window.bytesIn = document.getElementById("bytesIn").textContent || "";
		window.bytesOut = document.getElementById("bytesOut").textContent || "";
	} catch (e) {}
</script>

	<div id="bootLoader" aria-live="off">
	<div class="spinner-ring"></div>
	<div><b id="bootBrand">Loading your data…</b></div>
	<div id="bootText"></div>
</div>

<noscript><div style="padding:20px;text-align:center">This portal needs JavaScript. Please enable it and reload.</div></noscript>

<div id="app" style="display: none"></div>

<script>
	$(if refresh-timeout)
		// Router session refresh; waits for the injected app (jQuery) first.
		window.refreshSecs = $(refresh-timeout-secs);
		var refreshWait = setInterval(function () {
			if (typeof window.jQuery === 'undefined') { return; }
			clearInterval(refreshWait);
			setInterval(function () {
				// __histOpen is set while the voucher-history overlay is up; the
				// overlay is a full-screen modal, so reloading under it would throw
				// away whatever the customer was picking.
				if ((typeof insertingCoin === 'undefined' || !insertingCoin) && !window.__histOpen) {
					location.reload();
				}
			}, window.refreshSecs * 1000);
		}, 500);
	$(endif)
</script>

	<script src="assets/js/boot.js?v=172"></script>

</body>

</html>
