<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101418">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet hotspot - Error</title>
    <link rel="stylesheet" href="assets/css/base.css?v=170">
    <link rel="stylesheet" href="assets/css/core.css?v=170">
    <link rel="stylesheet" href="assets/css/JuanFiV2.css?v=170">
    <!-- ponytail: this page's .ie-fixMinHeight / .main / .wrap / .info were
         defined in no stylesheet in the repo, so the error page rendered
         unstyled. These four rules are what it actually needs. -->
    <style>
        .ie-fixMinHeight { min-height: 100dvh; }
        .main { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .wrap { max-width: 34rem; }
        .info { opacity: .75; }
    </style>
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <h1>Hotspot error: <span id="errMsg">$(error)</span></h1>
                <p class="info">Log in page: <a id="loginLink" href="login">log in</a></p>
                <span id="loginDst" style="display:none">$(link-login)</span>
            </div>
        </div>
    </div>
    <script>
        // $(error) stays inert span text (quotes can't break out); the
        // login URL is set from span text after a scheme check.
        try {
            var u = document.getElementById("loginDst").textContent || "login";
            document.getElementById("loginLink").href = /^(https?:\/\/|\/)/.test(u) ? u : "login";
        } catch (e) {}
    </script>
</body>

</html>
