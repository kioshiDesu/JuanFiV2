<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="stylesheet" href="assets/css/bootstrap.min.css?v=26">
	<link rel="stylesheet" href="assets/css/core.css?v=64">
	<link rel="stylesheet" href="assets/css/JuanFiV2.css?v=64">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#101418">
	<title>JuanFiV2 - Logged out</title>
	<script>
	// Auto-login pending: leave before first paint, no receipt flash.
	try {
		var r = null;
		if (typeof localStorage !== 'undefined' && localStorage) { r = localStorage.getItem("reLogin"); }
		if (r == null) { var m = document.cookie.match(/(?:^|; )reLogin=([^;]*)/); r = m ? decodeURIComponent(m[1]) : null; }
		if (r === "1") { window.location.replace("login"); }
	} catch (e) {}
	</script>
</head>

<!-- Router vars are user-adjacent ($(username) is typed at login): never
     inline them in JS strings or attributes — spans + textContent below. -->
<body id="loginBody">
<noscript><div style="padding:20px;text-align:center">This portal needs JavaScript. Please enable it and reload.</div></noscript>
<span id="loU" style="display:none">$(username)</span>
<span id="loUp" style="display:none">$(uptime)</span>
<span id="loIn" style="display:none">$(bytes-in-nice)</span>
<span id="loOut" style="display:none">$(bytes-out-nice)</span>
<span id="loLink" style="display:none">$(link-login)</span>

<div class="portal">
	<div class="hero">
		<h1 class="sub">Logged out</h1>
		<div class="vouchline">Voucher <span id="loUser"></span></div>
	</div>

	<div class="vouchline">Session <span id="loUptime"></span></div>
	<div class="vouchline">Uploaded <span id="loUp"></span> &bull; Downloaded <span id="loDown"></span></div>

	<div class="btnrow">
		<a id="loLogin" href="login" class="btn btn-info btn-block" style="display: block; width: 100%; min-height: 48px; line-height: 32px;">LOG IN AGAIN</a>
	</div>

	<div class="btnrow">
		<button type="button" id="loStay" class="btn btn-success btn-block" style="display: block; width: 100%; min-height: 48px;">STAY HERE</button>
		<button type="button" id="loCopy" class="btn btn-primary btn-block" style="display: block; width: 100%; min-height: 48px;">COPY VOUCHER</button>
	</div>

	<div class="pausenote" id="loNote" role="status" aria-live="polite">Returning to login in <span id="loCount">10</span>s — your saved code auto-connects there.</div>
</div>

<script>
(function () {
	function t(id) { try { return document.getElementById(id).textContent || ""; } catch (e) { return ""; } }
	try {
		document.getElementById("loUser").textContent = t("loU");
		document.getElementById("loUptime").textContent = t("loUp");
		document.getElementById("loUp").textContent = t("loIn");
		document.getElementById("loDown").textContent = t("loOut");
		var link = t("loLink") || "login";
		document.getElementById("loLogin").href = link;
		// Auto-login pending (pause/renew set reLogin): skip the receipt
		// preview entirely — the login page submits on its own.
		var relogin = null;
		try {
			if (typeof localStorage !== 'undefined' && localStorage) { relogin = localStorage.getItem("reLogin"); }
			if (relogin == null) {
				var m = document.cookie.match(/(?:^|; )reLogin=([^;]*)/);
				relogin = m ? decodeURIComponent(m[1]) : null;
			}
		} catch (e) {}
		if (relogin === "1") { window.location.replace(link); return; }
		var n = 10;
		var el = document.getElementById("loCount");
		var iv = setInterval(function () {
			n--;
			if (n <= 0) { clearInterval(iv); window.location.replace(link); return; }
			try { el.textContent = n; } catch (e) {}
		}, 1000);
		document.getElementById("loStay").onclick = function () {
			try { clearInterval(iv); } catch (e) {}
			try { document.getElementById("loNote").textContent = "Staying here — tap LOG IN AGAIN when ready."; } catch (e) {}
		};
		document.getElementById("loCopy").onclick = function () {
			var code = t("loU");
			function done(ok) {
				try { document.getElementById("loNote").textContent = ok ? "Voucher copied." : "Copy failed — long-press the code above."; } catch (e) {}
			}
			try {
				if (code && navigator.clipboard && navigator.clipboard.writeText) {
					navigator.clipboard.writeText(code).then(function () { done(true); }, function () { done(false); });
				} else { done(false); }
			} catch (e) { done(false); }
		};
	} catch (e) {}
})();
</script>

</body>

</html>
