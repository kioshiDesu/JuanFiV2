<!DOCTYPE html>
<!-- IAMNOTLOGINSTRINGPLEASEDONTREMOVE -->
<html lang="en">

<head>
	<link rel="stylesheet" href="assets/css/bootstrap.min.css?v=26">
		<link rel="stylesheet" href="assets/css/core.css?v=89">
	<link rel="stylesheet" href="assets/css/JuanFiV2.css?v=89">
	<title>JuanFiV2 Login Portal</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#101418">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<script>
		// Client facts for the single-file portal (portal.html renders the UI).
		window.PAGE = "login";
		window.mac = "$(mac)";
		window.uIp = "$(ip)";
		window.loginError = "";
		window.hotspotAddress = "$(server-address)";
		window.interfaceName = "$(interface-name)";
		window.loginAction = "$(link-login-only)";
		window.logoutAction = "$(link-logout)";
	</script>
	$(if chap-id)
	<script>
		window.chapId = "$(chap-id)";
		window.chapChallenge = "$(chap-challenge)";
	</script>
	$(endif)
	<script>
	$(if trial == 'yes')
	window.trialAllowed = true;
	window.trialUrl = "$(link-login-only)?dst=$(link-orig-esc)&username=T-$(mac-esc)";
	$(endif)
	</script>
	<script src="assets/js/boot.js?v=89"></script>
</head>

<body id="loginBody">

	<div id="bootLoader" aria-live="off">
	<div class="spinner-ring"></div>
	<div><b id="bootBrand">Loading your data…</b></div>
	<div id="bootText"></div>
</div>

<noscript><div style="padding:20px;text-align:center">This portal needs JavaScript. Please enable it and reload.</div></noscript>

<div id="app" style="display: none"></div>

$(if error)
<!-- $(error) embeds the username: never inline it in a JS string (quote
     breakout). textContent read keeps quotes inert. -->
<span id="loginErr" style="display:none">$(error)</span>
<script>
	try { window.loginError = document.getElementById("loginErr").textContent || ""; } catch (e) {}
</script>
$(endif)

<!-- $(link-orig) is the pre-login URL the router redirects to after a
     successful login. textContent read, never inlined (URL metachars). -->
<span id="loginDst" style="display:none">$(link-orig)</span>
<script>
	try { window.loginDst = document.getElementById("loginDst").textContent || ""; } catch (e) {}
</script>

</body>

</html>
