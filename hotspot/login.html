<!DOCTYPE html>
<!-- IAMNOTLOGINSTRINGPLEASEDONTREMOVE -->
<html lang="en">

<head>
	<link rel="stylesheet" href="assets/css/bootstrap.min.css?v=26">
	<link rel="stylesheet" href="assets/css/toast.min.css?v=26">
	<link rel="stylesheet" href="assets/css/core.css?v=26">
	<link rel="stylesheet" href="assets/css/JuanFiV2.css?v=26">
	<title>JuanFiV2 Login Portal</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<script src="assets/js/config.js?v=26"></script>
	<script>
		// Client facts for the single-file portal (portal.html renders the UI).
		window.PAGE = "login";
		window.mac = "$(mac)";
		window.uIp = "$(ip)";
		window.loginError = "";
		window.hotspotAddress = "$(server-address)";
		window.interfaceName = "$(interface-name)";
		window.loginAction = "$(link-login-only)";
		window.logoutAction = "$(link-logout)";
	</script>
	$(if chap-id)
	<script>
		window.chapId = "$(chap-id)";
		window.chapChallenge = "$(chap-challenge)";
		window.loginOrig = "$(link-orig)";
	</script>
	$(endif)
	$(if error)
	<script>
		window.loginError = "$(error)";
	</script>
	$(endif)
	<script src="assets/js/boot.js?v=26"></script>
</head>

<body id="loginBody">

<div id="bootLoader">
	<div class="spinner-ring"></div>
	<div><b>JuanFiV2</b></div>
	<div id="bootText">Starting...</div>
</div>

<div id="app" style="display: none"></div>

</body>

</html>
